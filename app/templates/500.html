{% extends "base.html" %}
{% block title %}Something Went Wrong{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center text-center" style="min-height: 70vh;">
    <div>
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
             style="width:72px;height:72px;background:var(--danger-soft);">
            <i class="bi bi-exclamation-octagon" style="font-size:2rem;color:var(--danger);"></i>
        </div>
        <h2 class="fw-bold mb-2">Something Went Wrong</h2>
        <p class="text-muted mb-4">An unexpected error occurred. Please try again.</p>
        <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}"
           class="btn btn-primary px-4">
            <i class="bi bi-house"></i> Back to {{ 'Dashboard' if current_user.is_authenticated else 'Login' }}
        </a>
    </div>
</div>
{% endblock %}
