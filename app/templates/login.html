{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                 style="width:64px;height:64px;background:linear-gradient(135deg,#101a34,#1c2b52);">
                <i class="bi bi-shield-check text-white" style="font-size:1.8rem;"></i>
            </div>
            <h4 class="mb-0 fw-bold">SafeGuard</h4>
            <p class="text-muted mb-0" style="font-size:0.9rem;">Fraud Detection & Review System</p>
        </div>
        <div class="card-flat p-4 p-sm-5">
            <h5 class="mb-3">Staff Sign In</h5>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2">Log in</button>
            </form>
        </div>
        <p class="text-muted text-center mt-3" style="font-size: 0.8rem;">Demo credentials: admin / admin123</p>
    </div>
</div>
{% endblock %}
